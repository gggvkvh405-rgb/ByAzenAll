name: Build Windows EXE

on:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'electron/**'
      - 'public/**'
      - 'src/**'
      - 'scripts/test-windows-startup.ps1'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ByAzen portable (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run desktop:win
      - name: Check launch from the unpacked ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'release/ByAzen-*-windows-x64.zip' | Select-Object -First 1
          $unpacked = 'release/Тест запуска ByAzen'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked
          ./scripts/test-windows-startup.ps1 -Exe (Join-Path $unpacked 'ByAzen.exe')
      - uses: actions/upload-artifact@v7
        with:
          path: release/ByAzen-*-windows-x64.zip
          if-no-files-found: error
          archive: false
      - name: Check launch of the portable EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'release/ByAzen-*-portable.exe' | Select-Object -First 1
          ./scripts/test-windows-startup.ps1 -Exe $exe.FullName
      - uses: actions/upload-artifact@v7
        with:
          path: release/ByAzen-*-portable.exe
          if-no-files-found: error
          archive: false
