name: Build Windows EXE

on:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'electron/**'
      - 'public/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ByAzen portable (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v7
        with:
          name: ByAzen-Windows-x64-portable
          path: release/ByAzen-*-portable.exe
          if-no-files-found: error
          compression-level: 0
